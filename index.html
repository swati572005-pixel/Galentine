<head>
<title>Be My Galentine 💗</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  padding: 0;
  background: linear-gradient(to bottom right, #ffd6ec, #ffe6f5);
  font-family: 'Poppins', sans-serif;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  margin-top: 20vh;
  font-size: 8vw;
  font-family: 'Playfair Display', serif;
  color: #e60073;
}

h2 {
  font-size: 4.5vw;
  font-weight: 400;
  color: #ff4da6;
  padding: 0 20px;
}

button {
  padding: 12px 28px;
  font-size: 4.5vw;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  margin: 12px;
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
  transition: 0.3s ease;
}

#yesBtn {
  background-color: #ff4da6;
  color: white;
}

#noBtn {
  background-color: #ffb3d9;
  color: white;
}

#finalMessage {
  display: none;
  font-size: 4.5vw;
  margin: 30px;
  max-width: 90%;
  color: #cc0066;
  line-height: 1.8;
  animation: fadeIn 0.8s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
